name: Overvåk og varsle

on:
  schedule:
    - cron: "*/5 * * * *"   # hvert 5. minutt (GitHub kan forsinke noen minutter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overvaak
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hent kurser og beregn signaler
        run: python scripts/hent.py
      - name: Varsle på e-post ved nye signaler
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VARSEL_TIL: ${{ secrets.VARSEL_TIL }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/varsle.py
      - name: Lagre data i repoet
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
